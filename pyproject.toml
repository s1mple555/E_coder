[project]
name = "e-coder"
version = "0.1.0"
description = "An observable personal coding agent with approval-first changes"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1", "Pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
